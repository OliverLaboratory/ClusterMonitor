<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compute Monitor</title>
<link rel="icon" type="image/png" href="/static/img/favicon.png">
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-border: #2a2d3a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #6c8cff;
    --green: #4caf50;
    --yellow: #ff9800;
    --red: #f44336;
    --bar-bg: #2a2d3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: 0.5px; }
  #status {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  #status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 18px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card.offline { opacity: 0.5; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .card-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .card-header .badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 4px;
    background: #2a3a2a;
    color: var(--green);
    font-weight: 500;
  }
  .card-header .badge.offline-badge {
    background: #3a2a2a;
    color: var(--red);
  }
  .card-header .desc {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-left: 8px;
  }
  /* Portraits */
  .portrait {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 2px solid var(--card-border);
    flex-shrink: 0;
  }
  .mini-card .portrait-sm {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 1.5px solid var(--card-border);
    float: right;
    margin: -2px 0 4px 8px;
  }

  .section-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 12px 0 6px 0;
  }
  .section-label:first-of-type { margin-top: 0; }

  /* Bar charts */
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 0.78rem;
  }
  .bar-label {
    min-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-wrap {
    flex: 1;
    height: 16px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .bar-value {
    min-width: 48px;
    text-align: right;
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  /* Color thresholds */
  .fill-low { background: var(--green); }
  .fill-mid { background: var(--yellow); }
  .fill-high { background: var(--red); }

  /* Stats row */
  .stats-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .stat {
    font-size: 0.78rem;
  }
  .stat .val {
    font-weight: 600;
    color: var(--accent);
  }

  /* Process table */
  .proc-table {
    width: 100%;
    font-size: 0.72rem;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .proc-table th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    padding: 3px 6px;
    border-bottom: 1px solid var(--card-border);
  }
  .proc-table td {
    padding: 3px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
  .proc-table tr:nth-child(even) td {
    background: rgba(255,255,255,0.02);
  }

  .error-msg {
    color: var(--red);
    font-size: 0.85rem;
    padding: 12px;
  }

  /* Loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--card) 25%, #252836 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    height: 16px;
    margin: 8px 0;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .gpu-temp {
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  .users-list {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .users-list span {
    color: var(--accent);
    font-weight: 500;
  }

  /* Overview grid */
  .overview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .mini-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.1s;
  }
  .mini-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .mini-card.offline { opacity: 0.45; }
  .mini-card .mc-name {
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .mini-card .mc-desc {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .mini-bar {
    height: 8px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 3px;
  }
  .mini-bar .bar-fill { height: 100%; border-radius: 3px; }
  .mini-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.62rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .mini-label-row .val { color: var(--text); font-weight: 500; }

  /* User cards */
  .user-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
    transition: border-color 0.2s;
  }
  .user-card:hover { border-color: var(--accent); }
  .user-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .user-portrait {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 2px solid var(--card-border);
    flex-shrink: 0;
  }
  .user-card-header .uc-name {
    font-size: 0.85rem;
    font-weight: 600;
  }
  .user-card-header .uc-user {
    font-size: 0.65rem;
    color: var(--text-dim);
  }
  .user-server-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    margin-bottom: 3px;
  }
  .user-server-row .srv-name {
    min-width: 72px;
    color: var(--accent);
    font-weight: 500;
  }
  .user-server-row .srv-detail {
    color: var(--text-dim);
  }
  .user-totals {
    display: flex;
    gap: 12px;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--card-border);
  }
  .user-totals .val { color: var(--text); font-weight: 600; }

  .overview-title {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  /* Refresh button */
  #refresh-btn {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75rem;
    transition: border-color 0.2s, color 0.2s;
  }
  #refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  #refresh-btn.spinning {
    pointer-events: none;
    opacity: 0.5;
  }

  /* Quote easter egg */
  .portrait, .portrait-sm { cursor: pointer; user-select: none; }
  #quote-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.25s ease;
    padding: 20px;
  }
  #quote-overlay.visible, #warn-overlay.visible { display: flex !important; opacity: 1 !important; }
  .quote-box {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 28px 32px;
    max-width: 560px;
    box-shadow: 0 8px 40px rgba(108, 140, 255, 0.25);
    text-align: center;
    transform: scale(0.96);
    transition: transform 0.25s ease;
  }
  #quote-overlay.visible .quote-box { transform: scale(1); }
  .quote-portrait {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top;
    border: 2px solid var(--accent);
    margin-bottom: 14px;
  }
  .quote-text {
    font-size: 1.02rem;
    font-style: italic;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 14px;
  }
  .quote-text::before { content: '\201C'; color: var(--accent); margin-right: 2px; }
  .quote-text::after  { content: '\201D'; color: var(--accent); margin-left: 2px; }
  .quote-author {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  /* Warning dot */
  .mini-card, .card { position: relative; }
  .warn-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
    border: 0;
    padding: 0;
    box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.6);
    animation: warn-pulse 1.6s infinite;
    z-index: 5;
  }
  .warn-dot:hover { transform: scale(1.3); }
  .mini-card .warn-dot { top: 6px; left: 6px; right: auto; }
  @keyframes warn-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(244, 67, 54, 0); }
    100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
  }
  .warn-box {
    background: var(--card);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 22px 26px;
    max-width: 520px;
    box-shadow: 0 8px 40px rgba(244, 67, 54, 0.22);
    text-align: left;
    transform: scale(0.96);
    transition: transform 0.25s ease;
  }
  #warn-overlay.visible .warn-box { transform: scale(1); }
  .warn-title {
    font-size: 1.02rem;
    font-weight: 600;
    color: var(--red);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .warn-sub {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .warn-item {
    border-top: 1px solid var(--card-border);
    padding: 10px 0 2px 0;
    font-size: 0.82rem;
  }
  .warn-item:first-of-type { border-top: none; }
  .warn-item .metric {
    color: var(--red);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .warn-item .suggest {
    color: var(--text);
    font-size: 0.78rem;
    line-height: 1.45;
  }
  .warn-item .suggest code {
    background: var(--bar-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.72rem;
  }
</style>
</head>
<body>
<header>
  <h1>Compute Monitor</h1>
  <div style="display:flex;align-items:center;gap:16px;">
    <button id="refresh-btn" onclick="fetchData()">Refresh</button>
    <div id="status"><span class="dot"></span>Loading...</div>
  </div>
</header>
<div id="quote-overlay" onclick="hideQuote()">
  <div class="quote-box">
    <img id="quote-portrait" class="quote-portrait" src="" alt="">
    <div id="quote-text" class="quote-text"></div>
    <div id="quote-author" class="quote-author"></div>
  </div>
</div>

<div id="warn-overlay" onclick="hideWarnings()" style="position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;align-items:center;justify-content:center;z-index:1000;opacity:0;transition:opacity 0.25s ease;padding:20px;">
  <div class="warn-box" onclick="event.stopPropagation()">
    <div class="warn-title"><span>&#9888;</span><span id="warn-server-name"></span></div>
    <div class="warn-sub">Overloaded &mdash; suggestions below</div>
    <div id="warn-body"></div>
  </div>
</div>

<div class="overview-title">Overview</div>
<div class="overview" id="overview-grid"></div>

<div class="overview-title" style="margin-top:8px;">Users</div>
<div class="overview" id="user-grid"></div>

<div class="overview-title" style="margin-top:8px;">Details</div>
<div class="grid" id="server-grid"></div>

function showQuote(serverName) {
  const entry = QUOTES[serverName];
  if (!entry) return;
  const q = entry.quotes[Math.floor(Math.random() * entry.quotes.length)];
  const server = (window.__lastServers || []).find(s => s.name === serverName);
  const img = server && server.img ? `/static/img/${server.img}` : '';
  document.getElementById('quote-portrait').src = img;
  document.getElementById('quote-text').textContent = q;
  document.getElementById('quote-author').textContent = entry.author;
  document.getElementById('quote-overlay').classList.add('visible');
}

function hideQuote() {
  document.getElementById('quote-overlay').classList.remove('visible');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideQuote(); hideWarnings(); } });

function getWarnings(s) {
  if (!s || s.error) return [];
  const warnings = [];
  const ramPct = s.ram ? s.ram.pct : 0;
  const diskPct = s.disk && s.disk.pct ? parseInt(s.disk.pct) : 0;

  if (ramPct >= 95) {
    warnings.push({
      metric: `RAM at ${Math.round(ramPct)}% (${(s.ram.used_mb/1024).toFixed(1)}G / ${(s.ram.total_mb/1024).toFixed(1)}G)`,
      suggest: 'Imminent OOM \u2014 the kernel may start killing processes (possibly sshd or system services, which can lock the node). Find the hog with <code>ps aux --sort=-%rss | head</code> and kill idle Python/Jupyter kernels now.',
    });
  }
  if (diskPct >= 97) {
    warnings.push({
      metric: `Disk / at ${diskPct}% (${s.disk.used} / ${s.disk.size})`,
      suggest: 'Root disk nearly full \u2014 at 100% system services (journald, sshd login, package managers) start failing and the node can become unreachable. Free space fast: <code>du -sh ~/.cache/* | sort -h</code>, delete old checkpoints, <code>docker system prune -a</code>.',
    });
  }
  for (const g of (s.gpus || [])) {
    if (g.temp_c >= 90) {
      warnings.push({
        metric: `GPU ${g.index} at ${g.temp_c}&deg;C`,
        suggest: 'Approaching thermal shutdown (~95\u00b0C). The card will fall off the bus and any job using it will hang, sometimes hanging the driver. Stop jobs on this GPU, check airflow, and cap power with <code>nvidia-smi -i ' + g.index + ' -pl &lt;watts&gt;</code>.',
      });
    }
  }
  return warnings;
}

function showWarnings(serverName) {
  const s = (window.__lastServers || []).find(x => x.name === serverName);
  if (!s) return;
  const warnings = getWarnings(s);
  if (!warnings.length) return;
  document.getElementById('warn-server-name').textContent = serverName;
  document.getElementById('warn-body').innerHTML = warnings.map(w =>
    `<div class="warn-item"><div class="metric">${w.metric}</div><div class="suggest">${w.suggest}</div></div>`
  ).join('');
  document.getElementById('warn-overlay').classList.add('visible');
}

function hideWarnings() {
  document.getElementById('warn-overlay').classList.remove('visible');
}

function fillClass(pct) {
  if (pct < 60) return 'fill-low';
  if (pct < 85) return 'fill-mid';
  return 'fill-high';
}

function fmtMem(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
  return mb + ' MB';
}

function barHtml(label, pct, detail) {
  return `<div class="bar-row">
    <span class="bar-label">${label}</span>
    <div class="bar-wrap"><div class="bar-fill ${fillClass(pct)}" style="width:${pct}%"></div></div>
    <span class="bar-value">${detail}</span>
  </div>`;
}

function renderServer(s) {
  if (s.error) {
    const offImg = s.img ? `<img class="portrait" src="/static/img/${s.img}" alt="${s.name}" ondblclick="showQuote('${s.name}')" title="Double-click me">` : '';
    return `<div class="card offline">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:10px;">
          ${offImg}
          <div><h2>${s.name}</h2><span class="desc">${s.desc || ''}</span></div>
        </div>
        <span class="badge offline-badge">OFFLINE</span>
      </div>
      <div class="error-msg">${s.error}</div>
    </div>`;
  }

  const imgTag = s.img ? `<img class="portrait" src="/static/img/${s.img}" alt="${s.name}" ondblclick="showQuote('${s.name}')" title="Double-click me">` : '';
  const warnings = getWarnings(s);
  const warnDot = warnings.length ? `<button class="warn-dot" onclick="event.stopPropagation(); showWarnings('${s.name}')" title="${warnings.length} warning${warnings.length>1?'s':''} \u2014 click for suggestions"></button>` : '';

  let html = `<div class="card">
    ${warnDot}
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:10px;">
        ${imgTag}
        <div>
          <h2>${s.name}</h2>
          <span class="desc">${s.desc}</span>
        </div>
      </div>
      <span class="badge">ONLINE</span>
    </div>`;

  // Quick stats
  const loadPct = s.cpu_count ? Math.min(100, Math.round(s.load['1m'] / s.cpu_count * 100)) : 0;
  html += `<div class="stats-row">
    <span class="stat">CPUs: <span class="val">${s.cpu_count}</span></span>
    <span class="stat">Load: <span class="val">${s.load['1m'].toFixed(1)}</span> / ${s.cpu_count}</span>
    <span class="stat">Up: <span class="val">${s.uptime}</span></span>
  </div>`;

  // RAM bar
  html += `<div class="section-label">Memory</div>`;
  html += barHtml('RAM', s.ram.pct, `${fmtMem(s.ram.used_mb)} / ${fmtMem(s.ram.total_mb)}`);

  // CPU load bar
  html += barHtml('CPU Load', loadPct, `${s.load['1m'].toFixed(1)} avg`);

  // Disk
  if (s.disk && s.disk.pct) {
    html += barHtml('Disk /', parseInt(s.disk.pct), `${s.disk.used} / ${s.disk.size}`);
  }

  // GPUs
  if (s.gpus && s.gpus.length > 0) {
    html += `<div class="section-label">GPUs</div>`;
    for (const g of s.gpus) {
      html += barHtml(
        `GPU ${g.index}`,
        g.mem_pct,
        `${fmtMem(g.mem_used_mb)} / ${fmtMem(g.mem_total_mb)}`
      );
      html += `<div style="display:flex;gap:12px;margin:-2px 0 4px 88px;">
        <span class="gpu-temp">Util: ${g.util_pct}%</span>
        <span class="gpu-temp">Temp: ${g.temp_c}&deg;C</span>
      </div>`;
    }
  }

  // GPU processes
  if (s.gpu_processes && s.gpu_processes.length > 0) {
    html += `<div class="section-label">GPU Processes</div>`;
    html += `<table class="proc-table"><tr><th>User</th><th>GPU Mem</th><th>Command</th></tr>`;
    for (const p of s.gpu_processes) {
      html += `<tr>
        <td>${p.user}</td>
        <td>${p.gpu_mem_mb} MB</td>
        <td title="${esc(p.command)}">${esc(p.command)}</td>
      </tr>`;
    }
    html += `</table>`;
  }

  // Top CPU processes
  if (s.top_processes && s.top_processes.length > 0) {
    html += `<div class="section-label">Top Processes (by CPU)</div>`;
    html += `<table class="proc-table"><tr><th>User</th><th>CPU%</th><th>Mem%</th><th>Command</th></tr>`;
    const shown = s.top_processes.slice(0, 8);
    for (const p of shown) {
      html += `<tr>
        <td>${p.user}</td>
        <td>${p.cpu_pct}</td>
        <td>${p.mem_pct}</td>
        <td title="${esc(p.command)}">${esc(p.command)}</td>
      </tr>`;
    }
    html += `</table>`;
  }

  // Logged-in users
  if (s.logged_in_users && s.logged_in_users.length > 0) {
    const names = [...new Set(s.logged_in_users.map(u => u.user))];
    html += `<div class="section-label">Logged In</div>`;
    html += `<div class="users-list">${names.map(n => `<span>${n}</span>`).join(', ')}</div>`;
  }

  html += `</div>`;
  return html;
}

function aggregateUsers(servers) {
  // user -> { servers: { serverName: { gpu_mem_mb, cpu_pct, mem_pct, procs: [...] } }, totals }
  const users = {};

  for (const s of servers) {
    if (s.error) continue;

    // GPU processes
    for (const p of (s.gpu_processes || [])) {
      const u = p.user;
      if (!u) continue;
      if (!users[u]) users[u] = { servers: {} };
      if (!users[u].servers[s.name]) users[u].servers[s.name] = { gpu_mem_mb: 0, cpu_pct: 0, procs: [] };
      users[u].servers[s.name].gpu_mem_mb += parseInt(p.gpu_mem_mb) || 0;
      users[u].servers[s.name].procs.push(p.command || '');
    }

    // Top CPU processes
    for (const p of (s.top_processes || [])) {
      const u = p.user;
      if (!u || u === 'root' || u === 'avahi' || u.startsWith('setroub') || u === 'polkitd' || u === 'dbus') continue;
      if (!users[u]) users[u] = { servers: {} };
      if (!users[u].servers[s.name]) users[u].servers[s.name] = { gpu_mem_mb: 0, cpu_pct: 0, procs: [] };
      users[u].servers[s.name].cpu_pct += parseFloat(p.cpu_pct) || 0;
    }
  }

  // Build sorted array, known users first
  const known = Object.keys(USER_MAP);
  const result = [];
  for (const u of known) {
    if (users[u]) result.push({ username: u, ...users[u] });
  }
  for (const u of Object.keys(users).sort()) {
    if (!known.includes(u)) result.push({ username: u, ...users[u] });
  }
  return result;
}

function renderUserCard(u) {
  const info = USER_MAP[u.username] || { display: u.username, img: null };
  const imgTag = info.img
    ? `<img class="user-portrait" src="/static/img/${info.img}" alt="${info.display}">`
    : `<div class="user-portrait" style="background:var(--bar-bg);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:600;">${info.display[0]}</div>`;

  let totalGpu = 0;
  let totalCpu = 0;
  let serverCount = Object.keys(u.servers).length;

  let rows = '';
  for (const [srv, data] of Object.entries(u.servers)) {
    totalGpu += data.gpu_mem_mb;
    totalCpu += data.cpu_pct;
    const parts = [];
    if (data.gpu_mem_mb > 0) parts.push(`GPU: ${fmtMem(data.gpu_mem_mb)}`);
    if (data.cpu_pct > 0) parts.push(`CPU: ${Math.round(data.cpu_pct)}%`);
    if (parts.length > 0) {
      rows += `<div class="user-server-row">
        <span class="srv-name">${srv}</span>
        <span class="srv-detail">${parts.join(' &middot; ')}</span>
      </div>`;
    }
  }

  if (!rows) return '';

  return `<div class="user-card">
    <div class="user-card-header">
      ${imgTag}
      <div>
        <div class="uc-name">${info.display}</div>
        <div class="uc-user">${u.username}</div>
      </div>
    </div>
    ${rows}
    <div class="user-totals">
      <span>${serverCount} server${serverCount > 1 ? 's' : ''}</span>
      ${totalGpu > 0 ? `<span>GPU: <span class="val">${fmtMem(totalGpu)}</span></span>` : ''}
      ${totalCpu > 0 ? `<span>CPU: <span class="val">${Math.round(totalCpu)}%</span></span>` : ''}
    </div>
  </div>`;
}

function renderMiniCard(s, idx) {
  if (s.error) {
    const miniOffImg = s.img ? `<img class="portrait-sm" src="/static/img/${s.img}" alt="${s.name}" onclick="event.stopPropagation()" ondblclick="event.stopPropagation(); showQuote('${s.name}')" title="Double-click me">` : '';
    return `<div class="mini-card offline" onclick="scrollToServer(${idx})">
      ${miniOffImg}
      <div class="mc-name">${s.name}</div>
      <div class="mc-desc">${s.desc || ''}</div>
      <div style="font-size:0.7rem;color:var(--red);">OFFLINE</div>
    </div>`;
  }

  const cpuPct = s.cpu_count ? Math.min(100, Math.round(s.load['1m'] / s.cpu_count * 100)) : 0;
  const ramPct = Math.round(s.ram.pct);

  // Aggregate GPU: average memory usage across all GPUs
  let gpuMemPct = 0;
  let gpuUtilPct = 0;
  if (s.gpus && s.gpus.length > 0) {
    gpuMemPct = Math.round(s.gpus.reduce((a, g) => a + g.mem_pct, 0) / s.gpus.length);
    gpuUtilPct = Math.round(s.gpus.reduce((a, g) => a + g.util_pct, 0) / s.gpus.length);
  }

  const miniImg = s.img ? `<img class="portrait-sm" src="/static/img/${s.img}" alt="${s.name}" onclick="event.stopPropagation()" ondblclick="event.stopPropagation(); showQuote('${s.name}')" title="Double-click me">` : '';
  const miniWarnings = getWarnings(s);
  const miniWarnDot = miniWarnings.length ? `<button class="warn-dot" onclick="event.stopPropagation(); showWarnings('${s.name}')" title="${miniWarnings.length} warning${miniWarnings.length>1?'s':''}"></button>` : '';

  let html = `<div class="mini-card" onclick="scrollToServer(${idx})">
    ${miniWarnDot}
    ${miniImg}
    <div class="mc-name">${s.name}</div>
    <div class="mc-desc">${s.desc}</div>`;

  // CPU load bar
  html += `<div class="mini-label-row"><span>CPU</span><span class="val">${cpuPct}%</span></div>`;
  html += `<div class="mini-bar"><div class="bar-fill ${fillClass(cpuPct)}" style="width:${cpuPct}%"></div></div>`;

  // RAM bar
  html += `<div class="mini-label-row"><span>RAM</span><span class="val">${ramPct}%</span></div>`;
  html += `<div class="mini-bar"><div class="bar-fill ${fillClass(ramPct)}" style="width:${ramPct}%"></div></div>`;

  // GPU bar (if any)
  if (s.gpus && s.gpus.length > 0) {
    html += `<div class="mini-label-row"><span>GPU Mem</span><span class="val">${gpuMemPct}%</span></div>`;
    html += `<div class="mini-bar"><div class="bar-fill ${fillClass(gpuMemPct)}" style="width:${gpuMemPct}%"></div></div>`;
    html += `<div class="mini-label-row"><span>GPU Util</span><span class="val">${gpuUtilPct}%</span></div>`;
    html += `<div class="mini-bar"><div class="bar-fill ${fillClass(gpuUtilPct)}" style="width:${gpuUtilPct}%"></div></div>`;
  }

  html += `</div>`;
  return html;
}

function scrollToServer(idx) {
  const cards = document.querySelectorAll('#server-grid .card');
  if (cards[idx]) {
    cards[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
    cards[idx].style.borderColor = 'var(--accent)';
    setTimeout(() => cards[idx].style.borderColor = '', 2000);
  }
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let refreshTimer;

async function fetchData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  btn.textContent = 'Refreshing...';

  try {
    const resp = await fetch('/api/servers');
    const servers = await resp.json();
    window.__lastServers = servers;
    document.getElementById('overview-grid').innerHTML =
      servers.map((s, i) => renderMiniCard(s, i)).join('');
    const userAgg = aggregateUsers(servers);
    document.getElementById('user-grid').innerHTML =
      userAgg.map(renderUserCard).filter(Boolean).join('');
    const grid = document.getElementById('server-grid');
    grid.innerHTML = servers.map(renderServer).join('');
    const now = new Date().toLocaleTimeString();
    document.getElementById('status').innerHTML =
      `<span class="dot"></span>Updated ${now} &middot; auto-refresh 30s`;
  } catch (e) {
    document.getElementById('status').innerHTML =
      `<span class="dot" style="background:var(--red)"></span>Fetch error`;
  } finally {
    btn.classList.remove('spinning');
    btn.textContent = 'Refresh';
  }
}

// Initial fetch + interval
fetchData();
refreshTimer = setInterval(fetchData, REFRESH_INTERVAL);
</script>
